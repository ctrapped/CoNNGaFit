[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "conngafit"
version = "0.1.0"
description = "Convolutional neural networks for fitting galactic parameters to synthetic HI 21cm datacubes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cameron Trapp" }, { name = "Caleb Choban" }]
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "h5py",
    "matplotlib",
    "scipy",
    "astropy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools]
py-modules = [
    "Datasets",
    "FITS_to_CoNNGaFit",
    "PlottingFunctions",
    "Unet3d_DDPM",
    "Unet3d_Dilated_ResNet",
    "Unet3d_ResBlock",
    "Unet_blocks",
    "Unet_diagnostics",
    "UseModel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["B905"]  # zip(strict=) is noisy for loops over shape-matched tensors

[tool.ruff.lint.per-file-ignores]
# Existing findings in files not yet rewritten; remove an entry once its file is cleaned up
"Datasets.py" = ["E701", "E722"]
"PlottingFunctions.py" = ["B007", "E722", "F841"]
"TrainModel_MassFlux_UNet.py" = ["E701", "E702", "E722", "F841"]
"TrainModel_RC_UNet.py" = ["E701", "E702", "E722", "F841"]
"UseModel.py" = ["E702", "E722", "F841"]
"examples/*.ipynb" = ["B023", "E731"]

[tool.ruff.format]
# Files not yet rewritten; remove an entry once its file is cleaned up
exclude = [
    "Datasets.py",
    "FITS_to_CoNNGaFit.py",
    "FITS_to_CoNNGaFit_Template.py",
    "InferenceTemplate.py",
    "InferenceTest_ValidationSet.py",
    "PlottingFunctions.py",
    "TrainModel_MassFlux_UNet.py",
    "TrainModel_RC_UNet.py",
    "UseModel.py",
    "examples/*.ipynb",
]
