[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "conngafit"
version = "0.1.0"
description = "Convolutional neural networks for fitting galactic parameters to synthetic HI 21cm datacubes."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Cameron Trapp" }, { name = "Caleb Choban" }]
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "h5py",
    "matplotlib",
    "scipy",
    "astropy",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
py-modules = [
    "Datasets",
    "FITS_to_CoNNGaFit",
    "PlottingFunctions",
    "Unet3d_Dilated_ResNet",
    "Unet3d_ResBlock",
    "UseModel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
