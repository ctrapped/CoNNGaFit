# ResBlock U-Net hyperparameters for train_model_unet.py (tuned for rotational_velocity)
# Pass a different file with --hyperparams. Every key below is required.

network = "resblock"  # The residual U-Net in unet3d_resblock.py, see networks.py

learning_rate = 1e-4
weight_decay = 1e-3
epochs = 300
n_fc = 3000   # Width of the fully connected head's hidden layers (output_head = "fc" only)
n_filt0 = 6   # Filters in the first encoder stage; doubles at each later stage
k0 = 9        # Initial kernel size
k1 = 3        # Kernel size for residual/deconv blocks

dropout_rate = 0.3  # Applied before the output layer, to regularize the head
# Disabled by default. Applies channel-wise dropout (nn.Dropout3d) inside every
# ResidualBlock/DeconvBlock - a much broader regularizer than dropout_rate, since it touches
# every stage of the encoder/decoder and the skip connections too. Only enable this if
# dropout_rate alone isn't closing the train/validation gap; start low (~0.1-0.15) rather than
# reusing dropout_rate's 0.3 - the deepest encoder stage shrinks to a tiny spatial size where
# dropping whole channels removes a large fraction of that stage's information.
block_dropout_rate = 0.0

# Output head, see NeuralNetwork in unet3d_resblock.py. Both conv heads predict each pixel from
# its neighborhood (needed for 128x128/512x512 images):
#   "conv_halfres" - adds a decoder stage to half resolution, folds the spectra into channels
#                    and adds global context
#   "conv"         - pools the spectra with learned attention weights, then refines with 2-d
#                    residual blocks
#   "fc"           - the original fully connected output layer (n_fc is then the bottleneck
#                    size), for 40x40 images or radial curves
output_head = "conv_halfres"

# Label scaling, computed once from every training label and saved with the model:
#   "none"      - train on labels in physical units
#   "symmetric" - divide by max(|label|), to [-1, 1] (e.g. radial momentum)
#   "one-sided" - map [min(label), max(label)] to [-1, 1] (e.g. rotational velocity)
label_scaling = "none"

# Weight each pixel's (or ring's) loss (MSE, or Gaussian NLL with predict_variance) by its
# mass ** mass_weight_power, normalized to mean 1 per image, so the loss isn't dominated by faint
# halo gas; meant for velocity targets. Pixels with no mass aren't trained (mean or 1σ).
#   0   - unweighted (default)
#   0.5 - square root of mass, so the densest pixels don't dominate either
#   1   - mass-weighted
mass_weight_power = 0

# Predict a per-pixel uncertainty along with each value: the network outputs a mean and a
# log-variance, trained with a Gaussian negative log-likelihood instead of MSE.
# Requires label_scaling = "symmetric" or "one-sided", since the loss floors the variance at
# 1e-6 in the units of the labels it trains on.
predict_variance = false

# Random seed for weight initialization, dropout and the order of training batches. Runs with the same
# seed, data and hyperparameters on the same machine give the same network.
seed = 0
