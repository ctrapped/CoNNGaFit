[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "conngafit"
version = "0.1.0"
description = "Convolutional neural networks for fitting galactic parameters to synthetic HI 21cm datacubes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cameron Trapp" }, { name = "Caleb Choban" }]
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "pandas",
    "h5py",
    "matplotlib",
    "scipy",
    "astropy",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[tool.setuptools]
py-modules = [
    "Datasets",
    "FITS_to_CoNNGaFit",
    "PlottingFunctions",
    "Unet3d_DDPM",
    "Unet3d_Dilated_ResNet",
    "Unet3d_ResBlock",
    "Unet_blocks",
    "Unet_diagnostics",
    "UseModel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["B905"]  # zip(strict=) is noisy for loops over shape-matched tensors
